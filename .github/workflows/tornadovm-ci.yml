name: TornadoVM CI Pipeline

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:
    inputs:
      fullBuild:
        description: 'Perform a full test across multiple JDKs'
        required: false
        type: boolean
        default: false

env:
  JDK_21_JAVA_HOME: /opt/jenkins/jdks/graal-23.1.0/jdk-21.0.3
  GRAALVM_21_JAVA_HOME: /opt/jenkins/jdks/graal-23.1.0/graalvm-community-openjdk-21.0.1+12.1
  MANDREL_21_JAVA_HOME: /opt/jenkins/jdks/graal-23.1.0/mandrel-java21-23.1.0.0-Final
  ZULU_21_JAVA_HOME: /opt/jenkins/jdks/graal-23.1.0/zulu21.28.85-ca-jdk21.0.0-linux_x64
  CORRETTO_21_JAVA_HOME: /opt/jenkins/jdks/graal-23.1.0/amazon-corretto-21.0.3.9.1-linux-x64
  MICROSOFT_21_JAVA_HOME: /opt/jenkins/jdks/graal-23.1.0/jdk-21.0.3+9
  TORNADO_ROOT: ${{ github.workspace }}
  TORNADO_SDK: ${{ github.workspace }}/bin/sdk
  CMAKE_ROOT: /opt/jenkins/cmake-3.25.2-linux-x86_64
  KFUSION_ROOT: /var/lib/jenkins/workspace/kfusion-tornadovm
  TORNADO_RAY_TRACER_ROOT: /var/lib/jenkins/workspace/TornadoVM-Ray-Tracer
  JAVAFX_SDK: /var/lib/jenkins/workspace/TornadoVM-Ray-Tracer/javafx-sdk-21.0.3/

jobs:
  # Job to determine which JDKs to test
  determine-jdks:
    runs-on: self-hosted
    outputs:
      jdks: ${{ steps.set-jdks.outputs.jdks }}
    steps:
      - name: Determine JDKs to test
        id: set-jdks
        run: |
          if [[ "${{ github.event.inputs.fullBuild }}" == "true" ]]; then
            echo 'jdks=["openjdk21", "graalvm21", "mandrel21", "zulu21", "corretto21", "microsoft21"]' >> $GITHUB_OUTPUT
          else
            # Randomly select one JDK
            JDKS=("openjdk21" "graalvm21" "mandrel21" "zulu21" "corretto21" "microsoft21")
            RANDOM_INDEX=$((RANDOM % 6))
            SELECTED_JDK=${JDKS[$RANDOM_INDEX]}
            echo "jdks=[\"$SELECTED_JDK\"]" >> $GITHUB_OUTPUT
            echo "Selected JDK: $SELECTED_JDK"
          fi

  # OpenJDK 21 Build and Test
  test-openjdk21:
    needs: determine-jdks
    if: contains(needs.determine-jdks.outputs.jdks, 'openjdk21')
    runs-on: self-hosted
    timeout-minutes: 240
    env:
      JAVA_HOME: /opt/jenkins/jdks/graal-23.1.0/jdk-21.0.3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PATH
        run: |
          echo "/opt/maven/bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/bin/bin" >> $GITHUB_PATH

      - name: Build TornadoVM
        run: make jdk21 BACKEND=ptx,opencl,spirv

      - name: PTX Unit Tests
        timeout-minutes: 45
        run: |
          tornado --devices
          tornado-test --verbose -J"-Dtornado.unittests.device=0:0 -Dtornado.ptx.priority=100"
          tornado-test -V -J"-Dtornado.unittests.device=0:0 -Dtornado.device.memory=1MB -Dtornado.ptx.priority=100" uk.ac.manchester.tornado.unittests.fails.HeapFail#test03
          test-native.sh

      - name: OpenCL Unit Tests - Nvidia Quadro GP100
        timeout-minutes: 45
        run: |
          tornado --devices
          tornado-test --verbose -J"-Dtornado.ptx.priority=100 -Dtornado.unittests.device=2:0"
          tornado-test -V -J"-Dtornado.ptx.priority=100 -Dtornado.unittests.device=2:0 -Dtornado.device.memory=1MB" uk.ac.manchester.tornado.unittests.fails.HeapFail#test03
          test-native.sh

      - name: OpenCL Unit Tests - Intel UHD Graphics 630
        timeout-minutes: 45
        run: |
          tornado --devices
          tornado-test --verbose -J"-Dtornado.ptx.priority=100 -Dtornado.unittests.device=2:1"
          tornado-test -V -J"-Dtornado.ptx.priority=100 -Dtornado.unittests.device=2:1 -Dtornado.device.memory=1MB" uk.ac.manchester.tornado.unittests.fails.HeapFail#test03
          test-native.sh

      - name: SPIR-V (OpenCL Runtime) Unit Tests
        timeout-minutes: 45
        run: |
          tornado --devices
          tornado-test --verbose -J"-Dtornado.ptx.priority=100 -Dtornado.unittests.device=1:0 -Dtornado.spirv.dispatcher=opencl"
          tornado-test -V -J"-Dtornado.ptx.priority=100 -Dtornado.unittests.device=1:0 -Dtornado.spirv.dispatcher=opencl -Dtornado.device.memory=1MB" uk.ac.manchester.tornado.unittests.fails.HeapFail#test03
          test-native.sh

      - name: SPIR-V (LevelZero Runtime) Unit Tests
        timeout-minutes: 45
        run: |
          tornado --devices
          tornado-test --verbose -J"-Dtornado.ptx.priority=100 -Dtornado.unittests.device=1:1 -Dtornado.spirv.dispatcher=levelzero"
          tornado-test -V -J"-Dtornado.ptx.priority=100 -Dtornado.unittests.device=1:1 -Dtornado.spirv.dispatcher=levelzero -Dtornado.device.memory=1MB" uk.ac.manchester.tornado.unittests.fails.HeapFail#test03
          test-native.sh

      - name: Run Benchmarks
        timeout-minutes: 15
        run: |
          python3 tornado-assembly/src/bin/tornado-benchmarks.py --printBenchmarks
          python3 tornado-assembly/src/bin/tornado-benchmarks.py --medium --skipSerial --iterations 5

      - name: Clone & Build KFusion
        timeout-minutes: 5
        run: |
          cd ${KFUSION_ROOT}
          git reset HEAD --hard
          git fetch
          git pull origin master
          mvn clean install -DskipTests

      - name: OpenCL Run KFusion
        timeout-minutes: 5
        run: |
          sleep 5
          cd ${KFUSION_ROOT}
          sed -i 's/kfusion.tornado.backend=PTX/kfusion.tornado.backend=OpenCL/' conf/kfusion.settings
          ./scripts/runOnlyOpenCL.sh

      - name: PTX Run KFusion
        timeout-minutes: 5
        run: |
          sleep 5
          cd ${KFUSION_ROOT}
          sed -i 's/kfusion.tornado.backend=OpenCL/kfusion.tornado.backend=PTX/' conf/kfusion.settings
          ./scripts/runOnlyPTX.sh

      - name: Clone & Build TornadoVM-Ray-Tracer
        timeout-minutes: 5
        run: |
          cd ${TORNADO_RAY_TRACER_ROOT}
          git reset HEAD --hard
          git fetch
          git checkout master
          git pull origin master
          mvn clean install

      - name: Run TornadoVM-Ray-Tracer
        timeout-minutes: 5
        run: |
          sleep 5
          cd ${TORNADO_RAY_TRACER_ROOT}
          ./bin/tornadovm-ray-tracer regression

