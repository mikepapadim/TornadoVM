          cd ${KFUSION_ROOT}
          sed -i 's/kfusion.tornado.backend=OpenCL/kfusion.tornado.backend=PTX/' conf/kfusion.settings
          ./scripts/runOnlyPTX.sh

      - name: Clone & Build TornadoVM-Ray-Tracer
        timeout-minutes: 5
        run: |
          cd ${TORNADO_RAY_TRACER_ROOT}
          git reset HEAD --hard
          git fetch
          git checkout master
          git pull origin master
          mvn clean install

      - name: Run TornadoVM-Ray-Tracer
        timeout-minutes: 5
        run: |
          sleep 5
          cd ${TORNADO_RAY_TRACER_ROOT}
          ./bin/tornadovm-ray-tracer regression

  # Microsoft JDK 21 Build and Test
  test-microsoft21:
    needs: determine-jdks
    if: contains(needs.determine-jdks.outputs.jdks, 'microsoft21')
    runs-on: self-hosted
    timeout-minutes: 240
    env:
      JAVA_HOME: /opt/jenkins/jdks/graal-23.1.0/jdk-21.0.3+9
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PATH
        run: |
          echo "/opt/maven/bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/bin/bin" >> $GITHUB_PATH

      - name: Build TornadoVM
        run: make jdk21 BACKEND=ptx,opencl,spirv

      - name: PTX Unit Tests
        timeout-minutes: 45
        run: |
          tornado --devices
          tornado-test --verbose -J"-Dtornado.unittests.device=0:0 -Dtornado.ptx.priority=100"
          tornado-test -V -J"-Dtornado.unittests.device=0:0 -Dtornado.device.memory=1MB -Dtornado.ptx.priority=100" uk.ac.manchester.tornado.unittests.fails.HeapFail#test03
          test-native.sh

      - name: OpenCL Unit Tests - Nvidia Quadro GP100
        timeout-minutes: 45
        run: |
          tornado --devices
          tornado-test --verbose -J"-Dtornado.ptx.priority=100 -Dtornado.unittests.device=2:0"
          tornado-test -V -J"-Dtornado.ptx.priority=100 -Dtornado.unittests.device=2:0 -Dtornado.device.memory=1MB" uk.ac.manchester.tornado.unittests.fails.HeapFail#test03
          test-native.sh

      - name: OpenCL Unit Tests - Intel UHD Graphics 630
        timeout-minutes: 45
        run: |
          tornado --devices
          tornado-test --verbose -J"-Dtornado.ptx.priority=100 -Dtornado.unittests.device=2:1"
          tornado-test -V -J"-Dtornado.ptx.priority=100 -Dtornado.unittests.device=2:1 -Dtornado.device.memory=1MB" uk.ac.manchester.tornado.unittests.fails.HeapFail#test03
          test-native.sh

      - name: SPIR-V (OpenCL Runtime) Unit Tests
        timeout-minutes: 45
        run: |
          tornado --devices
          tornado-test --verbose -J"-Dtornado.ptx.priority=100 -Dtornado.unittests.device=1:0 -Dtornado.spirv.dispatcher=opencl"
          tornado-test -V -J"-Dtornado.ptx.priority=100 -Dtornado.unittests.device=1:0 -Dtornado.spirv.dispatcher=opencl -Dtornado.device.memory=1MB" uk.ac.manchester.tornado.unittests.fails.HeapFail#test03
          test-native.sh

      - name: SPIR-V (LevelZero Runtime) Unit Tests
        timeout-minutes: 45
        run: |
          tornado --devices
          tornado-test --verbose -J"-Dtornado.ptx.priority=100 -Dtornado.unittests.device=1:1 -Dtornado.spirv.dispatcher=levelzero"
          tornado-test -V -J"-Dtornado.ptx.priority=100 -Dtornado.unittests.device=1:1 -Dtornado.spirv.dispatcher=levelzero -Dtornado.device.memory=1MB" uk.ac.manchester.tornado.unittests.fails.HeapFail#test03
          test-native.sh

      - name: Run Benchmarks
        timeout-minutes: 15
        run: |
          python3 tornado-assembly/src/bin/tornado-benchmarks.py --printBenchmarks
          python3 tornado-assembly/src/bin/tornado-benchmarks.py --medium --skipSerial --iterations 5

      - name: Clone & Build KFusion
        timeout-minutes: 5
        run: |
          cd ${KFUSION_ROOT}
          git reset HEAD --hard
          git fetch
          git pull origin master
          mvn clean install -DskipTests

      - name: OpenCL Run KFusion
        timeout-minutes: 5
        run: |
          sleep 5
          cd ${KFUSION_ROOT}
          sed -i 's/kfusion.tornado.backend=PTX/kfusion.tornado.backend=OpenCL/' conf/kfusion.settings
          ./scripts/runOnlyOpenCL.sh

      - name: PTX Run KFusion
        timeout-minutes: 5
        run: |
          sleep 5
          cd ${KFUSION_ROOT}
          sed -i 's/kfusion.tornado.backend=OpenCL/kfusion.tornado.backend=PTX/' conf/kfusion.settings
          ./scripts/runOnlyPTX.sh

      - name: Clone & Build TornadoVM-Ray-Tracer
        timeout-minutes: 5
        run: |
          cd ${TORNADO_RAY_TRACER_ROOT}
          git reset HEAD --hard
          git fetch
          git checkout master
          git pull origin master
          mvn clean install

      - name: Run TornadoVM-Ray-Tracer
        timeout-minutes: 5
        run: |
          sleep 5
          cd ${TORNADO_RAY_TRACER_ROOT}
          ./bin/tornadovm-ray-tracer regression

